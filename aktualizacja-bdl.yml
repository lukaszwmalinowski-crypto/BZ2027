name: Aktualizacja danych GUS BDL – powiaty
on:
  workflow_dispatch:
  schedule:
    - cron: '18 6 2,16 * *'  # po publikacji części danych, potem można ponowić ręcznie
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pobierz oficjalne szeregi historyczne
        run: python aktualizuj_bdl.py
      - name: Zapisz zmienione dane w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dane.json
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizacja danych bezrobocia powiatowego GUS BDL"
            git push
          fi
